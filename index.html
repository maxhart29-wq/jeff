<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocksi-Safe Live Discord Chat</title>
    <style>
        body { background-color: #1e1f22; color: #dbdee1; font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-area { background-color: #313338; width: 100%; max-width: 600px; height: 80vh; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
        .message-log { flex-grow: 1; padding: 16px; overflow-y: auto; }
        .message-row { display: flex; margin-bottom: 16px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; margin-right: 16px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0; }
        .message-content { display: flex; flex-direction: column; }
        .username { font-weight: 600; font-size: 1rem; color: #f2f3f5; margin-bottom: 4px; }
        .timestamp { font-size: 0.75rem; color: #949ba4; margin-left: 8px; }
        .text { font-size: 0.95rem; color: #dbdee1; word-break: break-word; }
        .input-area { padding: 16px; }
        .input-wrapper { background-color: #383a40; border-radius: 8px; padding: 10px 16px; }
        .input-wrapper input { background: transparent; border: none; color: #dbdee1; font-size: 0.95rem; width: 100%; outline: none; }
    </style>
</head>
<body>

    <div class="chat-area">
        <div class="message-log" id="messageLog">Welcome to the school-safe chat! Type a message below.</div>
        <div class="input-area">
            <form id="chatForm">
                <div class="input-wrapper">
                    <input type="text" id="msgInput" placeholder="Message #general" autocomplete="off" required>
                </div>
            </form>
        </div>
    </div>

    <!-- Include Pusher Library -->
    <script src="https://pusher.com"></script>
    <script>
        // 1. FILL IN YOUR PUSHER INFO HERE (Keep the quotation marks):
        const PUSHER_APP_KEY = "b2d208fdbcd5fb21592d";
        const PUSHER_CLUSTER = "us2";

        const nickname = prompt("Enter your chat username:") || "Anonymous";
        const avatarColor = '#' + Math.floor(Math.random()*16777215).toString(16);

        const messageLog = document.getElementById('messageLog');
        const chatForm = document.getElementById('chatForm');
        const msgInput = document.getElementById('msgInput');

        // Initialize Pusher Client
        const pusher = new Pusher(PUSHER_APP_KEY, {
            cluster: PUSHER_CLUSTER,
            forceTLS: true,
            userAuthentication: { endpoint: null } // Disables server-side login check for client events
        });

        // Channel name MUST start with "private-" for client events to work without a backend server
        const channel = pusher.subscribe('private-school-chat');

        // Listen for new messages coming from your friends
        channel.bind('client-new-message', function(data) {
            if(messageLog.innerHTML.includes("Welcome to the school-safe chat")) {
                messageLog.innerHTML = "";
            }

            messageLog.innerHTML += `
                <div class="message-row">
                    <div class="avatar" style="background-color: ${data.color}">${data.user.charAt(0).toUpperCase()}</div>
                    <div class="message-content">
                        <div class="username">${data.user} <span class="timestamp">${data.time}</span></div>
                        <div class="text">${data.text}</div>
                    </div>
                </div>
            `;
            messageLog.scrollTop = messageLog.scrollHeight;
        });

        // Send a message over Pusher
        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const textValue = msgInput.value.trim();
            if(!textValue) return;

            msgInput.value = ""; // Clear box immediately
            const timeString = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            const myMessage = {
                user: nickname,
                text: textValue,
                color: avatarColor,
                time: timeString
            };

            // 1. Send it out to everyone else
            channel.trigger('client-new-message', myMessage);

            // 2. Add it to your own screen immediately
            if(messageLog.innerHTML.includes("Welcome to the school-safe chat")) {
                messageLog.innerHTML = "";
            }
            messageLog.innerHTML += `
                <div class="message-row">
                    <div class="avatar" style="background-color: ${myMessage.color}">${myMessage.user.charAt(0).toUpperCase()}</div>
                    <div class="message-content">
                        <div class="username">${myMessage.user} <span class="timestamp">${myMessage.time}</span></div>
                        <div class="text">${myMessage.text}</div>
                    </div>
                </div>
            `;
            messageLog.scrollTop = messageLog.scrollHeight;
        });
    </script>
</body>
</html>
